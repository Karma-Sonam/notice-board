# File purpose: Green deployment (version 1.1.0) configured with FEATURE_PINNED env var from ConfigMap.
# Apply command: kubectl apply -f manifests/bluegreen/green-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board-green
  namespace: nb-02230128
  labels:
    app.kubernetes.io/name: notice-board
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notice-board
      slot: green
  template:
    metadata:
      labels:
        app: notice-board
        slot: green
    spec:
      containers:
        - name: notice-board
          image: notice-board:02230128-1.1.0
          imagePullPolicy: Never
          env:
            - name: FEATURE_PINNED
              valueFrom:
                configMapKeyRef:
                  name: notice-board-flags
                  key: FEATURE_PINNED
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5