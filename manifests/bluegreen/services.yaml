# File purpose: Defines production service (pointing to blue) and preview service (pointing to green).
# Apply command: kubectl apply -f manifests/bluegreen/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230128
spec:
  type: ClusterIP
  selector:
    app: notice-board
    slot: blue                   # Production service points to Blue initially
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-preview
  namespace: nb-02230128
spec:
  type: ClusterIP
  selector:
    app: notice-board
    slot: green                  # Preview service points to Green for pre-release testing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080